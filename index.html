<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BHAVE" />
  <meta name="theme-color" content="#FFD54F" />
  <title>BHAVE</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    :root{ --bg:#8BC34A; --yellow:#FFD54F; --border:#000; --plus:#3B8F1E; --minus:#D93025; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; }
    body{
      background:var(--bg); color:#111;
      font-family:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
    button:focus-visible{ outline:4px solid #1565c0; outline-offset:2px; }
    .app{ min-height:100%; display:flex; flex-direction:column; }
    header{
      position:sticky; top:0; z-index:5; background:var(--yellow); border-bottom:5px solid var(--border);
      padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
      display:flex; align-items:center; gap:10px; min-height:58px;
    }
    header h1{ margin:0; font-size:1.35rem; font-weight:900; flex:1; display:flex; align-items:center; gap:8px; }
    .back{ border:3px solid var(--border); background:#fff; border-radius:12px; padding:6px 12px; font-weight:900; font-size:1rem; }
    .who-chip{ border:3px solid var(--border); background:#fff; border-radius:999px; padding:4px 10px; font-weight:800; font-size:.85rem; }
    .chip{ color:#fff; border-radius:999px; padding:2px 14px; font-weight:900; }
    main{ flex:1; padding:14px; max-width:560px; width:100%; margin:0 auto; }
    .hint{ font-weight:800; margin:2px 2px 12px; color:#173404; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .student{
      border:4px solid var(--border); border-radius:18px; min-height:92px; color:#fff;
      font-size:1.8rem; font-weight:900; letter-spacing:.02em;
    }
    .student:active, .pm:active, .big:active{ transform:scale(.97); }
    .rows{ display:flex; flex-direction:column; gap:12px; }
    .row{
      display:grid; grid-template-columns:72px 1fr 72px; min-height:78px;
      border:4px solid var(--border); border-radius:16px; overflow:hidden; background:#fff;
    }
    .pm{ border:0; color:#fff; font-size:2.2rem; font-weight:900; line-height:1; }
    .pm.minus{ background:var(--minus); }
    .pm.plus{ background:var(--plus); }
    .pm:disabled{ opacity:.35; }
    .mid{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px 6px; }
    .mid .name{ font-weight:800; font-size:1rem; line-height:1.15; }
    .mid .val{ font-weight:900; font-size:1.5rem; font-variant-numeric:tabular-nums; }
    .row.has .mid{ background:#FFF1B8; }
    footer{
      position:sticky; bottom:0; background:var(--yellow); border-top:5px solid var(--border);
      padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px;
    }
    .toggle{ display:grid; grid-template-columns:1fr 1fr; border:4px solid var(--border); border-radius:14px; overflow:hidden; }
    .toggle button{ border:0; background:#fff; font-weight:900; font-size:1.1rem; min-height:50px; }
    .toggle button[aria-pressed="true"]{ background:#111; color:#fff; }
    .actions{ display:grid; grid-template-columns:1fr 1.5fr; gap:10px; }
    .big{ border:4px solid var(--border); border-radius:14px; min-height:58px; font-weight:900; font-size:1.2rem; }
    .cancel{ background:#fff; }
    .submit{ background:#2E7D32; color:#fff; }
    .submit:disabled{ background:#c9d6c9; color:#555; }
    .pick{ display:flex; flex-direction:column; gap:12px; }
    .pick .big{ background:#fff; min-height:72px; font-size:1.4rem; }
    .msg{ background:#fff; border:4px solid var(--border); border-radius:16px; padding:16px; font-weight:800; text-align:center; }
    .toast{
      position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
      background:#111; color:#fff; font-weight:900; padding:12px 18px; border-radius:999px; max-width:92vw; text-align:center;
      box-shadow:0 4px 14px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20;
    }
    .toast.show{ opacity:1; }
    .toast.home{ bottom:calc(24px + env(safe-area-inset-bottom,0px)); }
    [hidden]{ display:none !important; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="btnBack" hidden aria-label="Back to students">‹ Back</button>
    <h1 id="title">BHAVE</h1>
    <button class="who-chip" id="btnWho" hidden aria-label="Change who is using this phone"></button>
  </header>

  <!-- First time only: who is using this phone -->
  <main id="screenWho" hidden>
    <p class="hint">Who's using this phone? (You'll only be asked once.)</p>
    <div class="pick" id="staffList"></div>
    <div class="msg" id="staffMsg" hidden></div>
  </main>

  <!-- Screen 1: students -->
  <main id="screenStudents" hidden>
    <p class="hint">Tap a student</p>
    <div class="grid" id="studentGrid"></div>
    <div class="msg" id="studentsMsg" hidden></div>
  </main>

  <!-- Screen 2: behaviors for one student -->
  <main id="screenBehaviors" hidden>
    <div class="rows" id="behaviorRows"></div>
  </main>
  <footer id="behaviorFooter" hidden>
    <div class="toggle" role="group" aria-label="Measure">
      <button id="modeCount" aria-pressed="true">Count</button>
      <button id="modeTime" aria-pressed="false">Time (minutes)</button>
    </div>
    <div class="actions">
      <button class="big cancel" id="btnCancel">Cancel</button>
      <button class="big submit" id="btnSubmit" disabled>Submit</button>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---- Connection (filled in once; the aides never see or change this) ----
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwMJRoN3d60kIpNjXKR8R5JaXz8LMoPqK3ZKd0DNr9fp-c1proAJVMU0M5JLVlQJoPO0A/exec";
const KEY = "y7nkjobi14jz78w5";

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
let students = JSON.parse(store.get("bhave:students") || "[]");
let staff = JSON.parse(store.get("bhave:staff") || "[]");
let current = null;            // student being logged
let mode = "count";            // "count" | "min"
let tally = {};                // behavior -> { count, min }

/* ---------- talking to the Sheet ---------- */
async function request(params){
  const url = new URL(ENDPOINT);
  Object.entries({ ...params, key: KEY }).forEach(([k, v]) => url.searchParams.set(k, v));
  let res;
  try { res = await fetch(url.toString(), { cache: "no-store" }); }
  catch { throw new Error("no connection"); }
  let data;
  try { data = JSON.parse(await res.text()); } catch { throw new Error("Google error " + res.status); }
  if (!data.ok) throw new Error(data.error || "error");
  return data;
}

async function loadStudents(){
  try {
    const data = await request({ action: "setup" });
    students = data.students || [];
    staff = data.staff || [];
    store.set("bhave:students", JSON.stringify(students));
    store.set("bhave:staff", JSON.stringify(staff));
    $("studentsMsg").hidden = true;
  } catch (err) {
    if (!students.length) {
      $("studentsMsg").hidden = false;
      $("studentsMsg").textContent = "Can't load students. Check the internet connection and reopen the app.";
    }
  }
  renderStudents();
  renderStaff();
}

/* ---------- screens ---------- */
function show(screen){
  ["screenWho", "screenStudents", "screenBehaviors"].forEach(id => $(id).hidden = id !== screen);
  $("behaviorFooter").hidden = screen !== "screenBehaviors";
  $("btnBack").hidden = screen !== "screenBehaviors";
  $("btnWho").hidden = screen !== "screenStudents";
  window.scrollTo(0, 0);
}

function renderStudents(){
  const grid = $("studentGrid");
  grid.innerHTML = "";
  students.forEach(s => {
    const b = document.createElement("button");
    b.className = "student";
    b.style.background = s.color;
    b.textContent = s.initials;
    b.addEventListener("click", () => openStudent(s));
    grid.appendChild(b);
  });
  if (!students.length && $("studentsMsg").hidden) {
    $("studentsMsg").hidden = false;
    $("studentsMsg").textContent = "Loading students…";
  }
}

function openStudent(s){
  current = s;
  tally = {};
  s.behaviors.forEach(b => tally[b] = { count: 0, min: 0 });
  setMode("count");
  $("title").innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.style.background = s.color;
  chip.textContent = s.initials;
  $("title").appendChild(chip);
  renderRows();
  show("screenBehaviors");
}

function renderRows(){
  const rows = $("behaviorRows");
  rows.innerHTML = "";
  current.behaviors.forEach(b => {
    const v = mode === "count" ? tally[b].count : tally[b].min;
    const row = document.createElement("div");
    row.className = "row" + (tally[b].count || tally[b].min ? " has" : "");
    const minus = document.createElement("button");
    minus.className = "pm minus";
    minus.textContent = "−";
    minus.disabled = v === 0;
    minus.setAttribute("aria-label", "Remove one from " + b);
    minus.addEventListener("click", () => change(b, -1));
    const mid = document.createElement("div");
    mid.className = "mid";
    const name = document.createElement("div"); name.className = "name"; name.textContent = b;
    const val = document.createElement("div"); val.className = "val";
    val.textContent = mode === "count" ? (v === 1 ? "1 time" : v + " times") : v + " min";
    const others = mode === "count" ? tally[b].min : tally[b].count;
    if (others) {
      const note = document.createElement("div");
      note.style.cssText = "font-size:.75rem;font-weight:800;color:#555";
      note.textContent = mode === "count" ? "+ " + others + " min" : "+ " + others + (others === 1 ? " time" : " times");
      mid.append(name, val, note);
    } else {
      mid.append(name, val);
    }
    const plus = document.createElement("button");
    plus.className = "pm plus";
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Add one to " + b);
    plus.addEventListener("click", () => change(b, 1));
    row.append(minus, mid, plus);
    rows.appendChild(row);
  });
  $("btnSubmit").disabled = !pendingItems().length;
}

function change(b, d){
  const k = mode === "count" ? "count" : "min";
  tally[b][k] = Math.max(0, Math.min(999, tally[b][k] + d));
  if (navigator.vibrate) navigator.vibrate(15);
  renderRows();
}

function setMode(m){
  mode = m;
  $("modeCount").setAttribute("aria-pressed", String(m === "count"));
  $("modeTime").setAttribute("aria-pressed", String(m === "min"));
  if (current) renderRows();
}

function pendingItems(){
  const items = [];
  if (!current) return items;
  current.behaviors.forEach(b => {
    if (tally[b].count) items.push({ s: current.initials, b, n: tally[b].count, t: "count" });
    if (tally[b].min) items.push({ s: current.initials, b, n: tally[b].min, t: "min" });
  });
  return items;
}

function leave(){
  const n = pendingItems().length;
  if (n && !confirm("Throw away what you entered for " + current.initials + "? It hasn't been saved.")) return;
  goHome();
}

function goHome(){
  current = null;
  $("title").textContent = "BHAVE";
  show("screenStudents");
}

async function submit(){
  const items = pendingItems();
  if (!items.length) return;
  const btn = $("btnSubmit");
  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    await request({ action: "log", by: store.get("bhave:by") || "", items: JSON.stringify(items) });
    const who = current.initials;
    goHome();
    toast("✓ Saved for " + who, true);
    if (navigator.vibrate) navigator.vibrate(40);
  } catch (err) {
    toast(err.message === "no connection" ? "Not saved: no connection. Try again." : "Not saved (" + err.message + "). Try again.");
    btn.disabled = false;
  }
  btn.textContent = "Submit";
}

let toastTimer;
function toast(text, home){
  const t = $("toast");
  t.textContent = text;
  t.classList.toggle("home", !!home);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), text.startsWith("Not saved") ? 6000 : 2500);
}

/* ---------- who is using this phone ---------- */
function setWho(by){
  store.set("bhave:by", by);
  $("btnWho").textContent = by;
  show("screenStudents");
}
// Staff names come from the Sheet's Staff tab
function renderStaff(){
  const list = $("staffList");
  list.innerHTML = "";
  staff.forEach(name => {
    const b = document.createElement("button");
    b.className = "big";
    b.textContent = name;
    b.addEventListener("click", () => setWho(name));
    list.appendChild(b);
  });
  $("staffMsg").hidden = staff.length > 0;
  $("staffMsg").textContent = "Loading names…";
}
$("btnWho").addEventListener("click", () => show("screenWho"));

$("btnBack").addEventListener("click", leave);
$("btnCancel").addEventListener("click", leave);
$("btnSubmit").addEventListener("click", submit);
$("modeCount").addEventListener("click", () => setMode("count"));
$("modeTime").addEventListener("click", () => setMode("min"));
window.addEventListener("beforeunload", e => { if (pendingItems().length) { e.preventDefault(); e.returnValue = ""; } });

// Start: show cached students instantly, then refresh from the Sheet
const by = store.get("bhave:by");
if (by) { $("btnWho").textContent = by; show("screenStudents"); } else { show("screenWho"); }
renderStudents();
renderStaff();
loadStudents();
document.addEventListener("visibilitychange", () => { if (!document.hidden && !current) loadStudents(); });
</script>
</body>
</html>
